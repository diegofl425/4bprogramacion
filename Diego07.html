    <header>
        <form id="form" style="display:flex;align-items:center;gap:10px;margin:0;">
            <input type="text" id="search" class="search" placeholder="Buscar Peliculas">
            <button id="searchBtn" type="submit" style="padding:0.5rem 1rem; border-radius:50px; border:none; background:#373b69; color:#fff; font-size:15px; cursor:pointer;">Buscar</button>
        </form>
    </header>
    <main id="main"></main>

    <script>
        const API_URL = 'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w1280';
        const SEARCH_API = 'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query='; 
        
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getMovies (API_URL)

        async function getMovies(url){
            const res = await fetch(url);
            const data = await res.json();
            showMovies(data.results);
        }
        function showMovies(movies){
            main.innerHTML = '';
            movies.forEach((movie) =>{
                

                const{title, poster_path, vote_average, overview} = movie;
               

                const movieElements = document.createElement('div');
                movieElements.classList.add('movie');
                movieElements.innerHTML=`
                <img src = "${IMG_PATH + poster_path}" alt="${title}">
                <div class="movie-info">
                    <h3>${title}</h3>
                    <span class = "${getClassByRate(vote_average)}">
                        ${vote_average}</span>
                        </div>
                        <div class = "overview">
                            <h3>Overview</h3>
                            ${overview}
                            </div>`
                    main.appendChild(movieElements);
            }); }
            function getClassByRate(vote){
                if(vote >= 8){
                    return 'blue';
                }else if(vote >=5){
                    return 'white';
                }else{
                    return 'red';
                }}
                form.addEventListener('submit', (e) =>{
                    e.preventDefault();
                    const searchTerm = search.value.trim();
                    if(searchTerm){
                        getMovies(SEARCH_API + encodeURIComponent(searchTerm));
                        search.value='';
                    }else{
                        window.location.reload();
                    }
                });
    </script>
